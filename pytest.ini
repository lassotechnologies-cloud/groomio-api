[pytest]
# Put the repository root on sys.path.
#
# Without this, `pytest` and `python -m pytest` behave differently and only one
# of them works. `python -m pytest` inserts the current directory into sys.path
# as a side effect of how Python runs modules; the `pytest` console script does
# not. Meanwhile pytest's own "prepend" import mode inserts `tests/` — because
# there is no `tests/__init__.py` — not the repository root. So the bare
# `pytest` that CI runs died at collection with:
#
#     tests/conftest.py: ModuleNotFoundError: No module named 'app'
#
# while `python -m pytest` collected all 267 tests locally, which is how the
# breakage stayed hidden. Declaring pythonpath makes both invocations behave the
# same, and stops CI and local runs from diverging again.
pythonpath = .

# pytest-asyncio configuration.
#
# Why AUTO mode is required: `tests/conftest.py` declares the `db` fixture as a
# plain `@pytest.fixture` on an `async def` generator. pytest-asyncio's default
# STRICT mode only wraps async fixtures carrying `@pytest_asyncio.fixture`, so in
# STRICT mode pytest hands the raw async-generator object to the test and fails
# setup with:
#
#     requested an async fixture 'db', with no plugin or hook that handled it
#
# AUTO mode wraps every coroutine/async-generator fixture, which is what makes the
# `db` fixture usable. This is a test-configuration concern only — it changes no
# application code and no application behaviour.
#
# Setting `asyncio_default_fixture_loop_scope` silences the pytest-asyncio
# deprecation warning about an unset loop scope and makes the fixture loop scope
# explicit: one event loop per fixture function.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function