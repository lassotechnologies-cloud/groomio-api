# Test-only PostgreSQL for integration tests.
# Run: docker compose -f docker-compose.test.yml up -d
# Then: createdb -U postgres groomio_test  (or use ./setup_test_db.sh, which does it)
# Finally:
#   TEST_DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5433/groomio_test pytest tests/
#
# ── Why 5433 and not 5432 ────────────────────────────────────────────────────
# This file used to publish 5432, which is wrong twice over:
#
#   1. Port 5432 is the conventional default for a *development* PostgreSQL, and
#      one is already running on this machine (`groomie-postgres`). Following
#      these instructions verbatim connected the test suite to the development
#      database — and `tests/conftest.py` drops and recreates the schema on every
#      run. The database-name guard (`_TEST_DB_PATTERN`) is what stopped that
#      from destroying data, not the port mapping.
#   2. The documented URL for these tests is port 5433, and the container already
#      in use (`groomio-test-postgres`) publishes 5433.
#
# Publishing on a non-default port keeps "the thing that wipes a schema every run"
# off the port every developer assumes is their dev database.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # Bound to localhost only. This container has no business being reachable
      # from the network, and it holds a superuser account with a fixed password.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
