[alembic]
script_location = migrations
prepend_sys_path = .
# NEVER hardcode a real URL here — env.py prefers the DATABASE_URL env var.
# The value below is a localhost placeholder for offline tooling only.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/groomio

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
